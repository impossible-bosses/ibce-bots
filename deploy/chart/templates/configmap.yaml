apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ibce-bots.configMapName" . }}
  labels:
    {{- include "ibce-bots.labels" . | nindent 4 }}
data:
  constants.py: |
    GUILD_NAME = {{ .Values.constants.guildName | quote }}
    BNET_CHANNEL_NAME = {{ .Values.constants.bnetChannelName | quote }}
    ENT_CHANNEL_NAME = {{ .Values.constants.entChannelName | quote }}

    # The COM guild. These are just random numbers - enter a valid Discord server and channel.
    COM_GUILD_ID = {{ .Values.constants.comGuildId }}
    COM_CHANNEL_ID = {{ .Values.constants.comChannelId }}

    SHAMAN_ID = {{ .Values.constants.shamanId }}
    PEON_ID = {{ .Values.constants.peonId }}
    PUB_HOST_ID = {{ .Values.constants.pubHostId }}

    COMMAND_CHARACTER = {{ .Values.constants.commandCharacter | quote }}

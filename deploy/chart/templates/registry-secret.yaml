{{- if .Values.imagePullSecrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecrets.name }}
  labels:
    {{- include "ibce-bots.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  # Credentials for pulling the (private) image from ghcr.io, e.g. a
  # GitHub token with read:packages scope.
  .dockerconfigjson: |
    {{ printf "{\"auths\":{\"ghcr.io\":{\"username\":%q,\"password\":%q,\"auth\":%q}}}"
      .Values.imagePullSecrets.username .Values.imagePullSecrets.password
      (printf "%s:%s" .Values.imagePullSecrets.username .Values.imagePullSecrets.password | b64enc) | b64enc }}
{{- end }}

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ibce-bots.pvcName" . }}
  labels:
    {{- include "ibce-bots.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce # single-replica bot
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}

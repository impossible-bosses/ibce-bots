{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ibce-bots.secretName" . }}
  labels:
    {{- include "ibce-bots.labels" . | nindent 4 }}
type: Opaque
stringData:
  # BOT_ID is the bot's COM network id (integer, as in the old params.py).
  BOT_ID: {{ .Values.params.botId | squote }}
  # BOT_TOKEN is the Discord bot token.
  BOT_TOKEN: {{ .Values.params.botToken | squote }}
  # Empty (or unset) => the bot exits on code update so the pod gets
  # restarted by Kubernetes. WARNING: any non-empty value (even the string
  # "false") is truthy in main.py and triggers "sudo shutdown -r now".
  REBOOT_ON_UPDATE: {{ .Values.params.rebootOnUpdate | squote }}
{{- end }}

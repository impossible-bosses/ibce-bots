apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ibce-bots-data
  namespace: ibce-bots
  labels:
    app: ibce-bots
spec:
  accessModes:
    - ReadWriteOnce # single-replica bot
  storageClassName: "" # <-- set your StorageClass at deployment time (e.g. standard, longhorn, ...)
  resources:
    requests:
      storage: 1Gi

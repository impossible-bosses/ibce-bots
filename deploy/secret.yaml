apiVersion: v1
kind: Secret
metadata:
  name: ibce-bots-params
  namespace: ibce-bots
  labels:
    app: ibce-bots
type: Opaque
stringData:
  # <== populate at deployment time.
  # BOT_ID is the bot's COM network id (integer, as in the old params.py).
  BOT_ID: "<bot_id>"
  # BOT_TOKEN is the Discord bot token.
  BOT_TOKEN: "<discord_bot_token>"
  # Empty (or unset) => the bot exits on code update so the pod gets restarted
  # by Kubernetes. WARNING: any non-empty value (even the string "false") is
  # truthy in main.py and triggers "sudo shutdown -r now", which does nothing
  # in a container except fail silently. Keep it empty for Kubernetes.
  REBOOT_ON_UPDATE: ""

name: verify

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-python is a github-owned action: the repository allows no
      # third-party actions, so a bare `python3.11` (not guaranteed to exist
      # on hosted runners) is replaced by this.
      - name: Set up python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # requirements-dev only carries mypy/pytest, but the test module
      # imports replays (which imports discord), so the runtime
      # requirements must be installed as well.
      - name: Install dependencies
        run: python3.11 -m pip install -r ./requirements.txt -r ./requirements-dev.txt

      - name: mypy
        # Deliberately non-blocking: replays.py / lobbies.py pre-date
        # --strict (93 pre-existing errors, missing annotations). This step
        # surfaces them as annotations on the PR; drop continue-on-error
        # once they are fixed in the code.
        continue-on-error: true
        run: python3.11 -m mypy --strict .

      - name: pytest
        run: python3.11 -m pytest

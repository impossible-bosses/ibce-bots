name: Docker Image CI

on:
  push:
    branches: [ "go-docker" ]
  pull_request:
    branches: [ "go-docker" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file dockerfile --tag ibce-bot:$(date +%s)